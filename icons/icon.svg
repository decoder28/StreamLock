<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- JioStar Brand Gradient: Royal Blue -> Vibrant Violet -> JioHotstar Magenta -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c3ae8" />
      <stop offset="45%" stop-color="#7214c4" />
      <stop offset="100%" stop-color="#eb0877" />
    </linearGradient>

    <!-- Top Gloss/Sheen -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Spark Gold/Amber Gradient -->
    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffea00" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>

    <!-- Drop Shadow for White Emblem -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Inset so Antialiasing is Ultra-Smooth -->
  <rect x="2" y="2" width="124" height="124" rx="27" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="60" rx="27" fill="url(#topSheen)" />
  <rect x="2.75" y="2.75" width="122.5" height="122.5" rx="26.25" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.28" />

  <!-- Main Symbol (Play Triangle + Hotstar Spark + Speed Arcs) -->
  <g filter="url(#shadow)">
    <!-- Play Triangle with Rounded Corners -->
    <path d="M 38 33 C 34.5 31 30 33.5 30 37.6 L 30 90.4 C 30 94.5 34.5 97 38 95 L 83.5 68.6 C 87 66.5 87 61.5 83.5 59.4 Z"
          fill="#ffffff" />

    <!-- Hotstar 8-point Starburst inside Play Button -->
    <g transform="translate(52, 64) scale(0.62)">
      <!-- Starburst Silhouette -->
      <polygon points="0,-25 5,-8 23,-23 8,-5 25,0 8,5 23,23 5,8 0,25 -5,8 -23,23 -8,5 -25,0 -8,-5 -23,-23 -5,-8"
               fill="#6810b4" opacity="0.85" />
      <polygon points="0,-21 4.2,-6.5 19,-19 6.5,-4.2 21,0 6.5,4.2 19,19 4.2,6.5 0,21 -4.2,6.5 -19,19 -6.5,4.2 -21,0 -6.5,-4.2 -19,-19 -4.2,-6.5"
               fill="url(#sparkGold)" />
      <circle cx="0" cy="0" r="3.6" fill="#ffffff" />
    </g>

    <!-- Streaming Buffer / Quality Signal Arcs -->
    <!-- Inner Arc -->
    <path d="M 91 49 C 95.5 53.5 98 58.5 98 64 C 98 69.5 95.5 74.5 91 79"
          fill="none"
          stroke="#ffffff"
          stroke-width="5"
          stroke-linecap="round" />

    <!-- Outer Arc (Cyan Hotstar/Jio Accent) -->
    <path d="M 102 41 C 108.5 47.5 112 55.5 112 64 C 112 72.5 108.5 80.5 102 87"
          fill="none"
          stroke="#00f0ff"
          stroke-width="5"
          stroke-linecap="round" />
  </g>
</svg>
